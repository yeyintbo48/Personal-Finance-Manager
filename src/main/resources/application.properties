spring.application.name=financemanager
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/financemanager_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:default_password}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
logging.level.org.hibernate.orm.jdbc.bind=trace
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.profiles.active=dev
